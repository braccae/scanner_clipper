[project]
name = "scanner-clipper"
version = "0.1.0"
description = "Automatically detect, extract, and clean individual photos from batch scans."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "easyocr>=1.7.2",
]

[project.scripts]
scanner-clipper = "scanner_clipper:main"
image-resizer = "image_resizer:main"
exif-date-editor = "exif_date_editor:main"
photo-dashboard = "gui:main"
photo-desktop = "desktop_app:main"

[tool.setuptools]
py-modules = ["scanner_clipper", "image_resizer", "exif_date_editor", "gui", "desktop_app"]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
